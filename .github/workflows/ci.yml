name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Build Binaries
        run: |
          go build -v ./cmd/orbit
          go build -v ./cmd/orbit-bench
          go build -v ./cmd/orbit-chaos
          go build -v ./cmd/orbit-admin

      - name: Run Test Suite (Windows)
        if: matrix.os == 'windows-latest'
        run: go test -v ./... -race -count=1 -timeout 300s

      - name: Run Test Suite with Coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: go test -v ./... -race -count=1 -timeout 300s -coverprofile=coverage.out

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  frontend:
    name: Frontend CI (Lint, Typecheck & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type validation
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build
