name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Build Binaries
        run: |
          go build -v ./cmd/orbit
          go build -v ./cmd/orbit-bench
          go build -v ./cmd/orbit-chaos
          go build -v ./cmd/orbit-admin

      - name: Run Test Suite (Race Detector Enabled)
        run: go test -v ./... -race -count=1 -timeout 300s

      - name: Code Coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -coverprofile=coverage.out ./...
