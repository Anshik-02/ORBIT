version: '3.8'

networks:
  orbit-cluster-net:
    driver: bridge

volumes:
  orbit_data_a:
  orbit_data_b:
  orbit_data_c:
  orbit_data_d:
  orbit_data_e:

services:
  node-a:
    build: .
    container_name: orbit-node-a
    command: ["-config", "configs/node-a.json", "-cluster", "configs/cluster.json"]
    environment:
      - ORBIT_NODE_ID=node-a
      - ORBIT_ADDRESS=0.0.0.0:2525
      - ORBIT_RAFT_ADDRESS=0.0.0.0:3525
    ports:
      - "2525:2525"
      - "3525:3525"
    volumes:
      - orbit_data_a:/home/orbit/data
    networks:
      - orbit-cluster-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2525/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  node-b:
